name: Project Release Artifacts

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    uses: ./.github/workflows/create_release_page.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      draft: false

  build:
    name: Create ${{ matrix.target }} build
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        target: [iOS]
        include:
          - os: macos-14
            target: iOS
            build_path: build
            asset_extension: .ipa
            asset_content_type: application/octet-stream

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          # Runner Python version (executes build tools, not the app itself)
          # - Windows/Linux: 3.11 (stable, matches requirements.txt)
          # - Android: 3.11 (p4a will build its own 3.14.2 from source for the app)
          python-version: '3.11'

      - name: Install requirements
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Apple requirements
        if: matrix.target == 'iOS' || matrix.target == 'macOS'
        run: |
          pip install pyobjus kivy-ios pbxproj

      - name: Install Linux requirements
        if: startsWith(matrix.target, 'Linux')
        run: |
          pip install ffpyplayer

# iOS
      - name: Install iOS build dependencies
        if: matrix.target == 'iOS'
        run: |
          brew install autoconf automake libtool pkg-config
          brew link libtool

      - name: Import Apple code-signing certificate and provisioning profile
        if: matrix.target == 'iOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_P12_KEY }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_IOS_PROFILE }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$APPLE_PROVISIONING_PROFILE" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cp "$PROFILE_PATH" ~/Library/MobileDevice/"Provisioning Profiles"/tlum_appstore.mobileprovision

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

          python3 ios/extract_profile_info.py "$PROFILE_PATH" >> $GITHUB_ENV

      - name: Update version and codesign identity in buildozer.spec
        if: matrix.target == 'iOS'
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed -i '' -e "s/^version = .*/version = ${{ needs.release.outputs.version }}/" buildozer.spec
          sed -i '' -e "s/^android.numeric_version = .*/android.numeric_version = ${{ needs.release.outputs.build_number }}/" buildozer.spec
          sed -i '' -e "s|^#ios.codesign.debug = .*|ios.codesign.debug = \"$APPLE_CODESIGN_IDENTITY\"|" buildozer.spec
          sed -i '' -e "s|^#ios.codesign.release = .*|ios.codesign.release = \"$APPLE_CODESIGN_IDENTITY\"|" buildozer.spec
          sed -i '' -e "s/^#ios.codesign.development_team.debug = .*/ios.codesign.development_team.debug = $APPLE_TEAM_ID/" buildozer.spec
          sed -i '' -e "s/^#ios.codesign.development_team.release = .*/ios.codesign.development_team.release = $APPLE_TEAM_ID/" buildozer.spec

      # buildozer tries to compile the phonegap/ios-deploy companion CLI (used only by
      # `buildozer ios deploy/run`, never by `release`) via xcodebuild, and that clone is
      # broken upstream ("does not contain an Xcode project"). Pre-seed a stub binary so
      # buildozer's file-exists check skips that build entirely.
      - name: Stub out unused buildozer ios-deploy helper
        if: matrix.target == 'iOS'
        run: |
          mkdir -p .buildozer/ios/platform/ios-deploy
          printf '#!/bin/sh\nexit 0\n' > .buildozer/ios/platform/ios-deploy/ios-deploy
          chmod +x .buildozer/ios/platform/ios-deploy/ios-deploy

      # First pass clones kivy-ios, compiles the recipes (slow) and generates the Xcode
      # project + Info.plist. It may fail at the archive/export step before the plist is
      # patched below, so the failure is tolerated here and the build is retried after.
      - name: Build iOS recipes and Xcode project (first pass)
        if: matrix.target == 'iOS'
        continue-on-error: true
        env:
          PYTHONHOME: ""
          PYTHONPATH: ""
        run: |
          buildozer ios release

      - name: Patch generated Info.plist and force manual code signing
        if: matrix.target == 'iOS'
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PLIST=$(find .buildozer/ios/platform/kivy-ios -name "*-Info.plist" | head -1)
          ./ios/patch_info_plist.sh "$PLIST"

          PBXPROJ=$(find .buildozer/ios/platform/kivy-ios -name "project.pbxproj" | head -1)
          python3 ios/configure_code_signing.py "$PBXPROJ" tlum "$APPLE_CODESIGN_IDENTITY" "$APPLE_TEAM_ID" \
            "$APPLE_PROVISIONING_PROFILE_UUID" "$APPLE_PROVISIONING_PROFILE_NAME"

      - name: Build and archive iOS IPA (release pass)
        if: matrix.target == 'iOS'
        env:
          PYTHONHOME: ""
          PYTHONPATH: ""
        run: |
          buildozer ios release

      - name: Search for a package and copy to workspace
        if: matrix.target == 'iOS'
        run: |
          IPA_PATH=$(find build -name "*.ipa" -type f | head -1)
          cp "$IPA_PATH" "$GITHUB_WORKSPACE/tlum_${{ matrix.target }}${{ matrix.asset_extension }}"

      - name: Upload IPA to TestFlight / App Store Connect
        if: matrix.target == 'iOS'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_API_ISSUE }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APPLE_API_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          xcrun altool --upload-app -f "$GITHUB_WORKSPACE/tlum_${{ matrix.target }}${{ matrix.asset_extension }}" -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Remove iOS signing keychain
        if: always() && matrix.target == 'iOS'
        run: security delete-keychain "$KEYCHAIN_PATH" || true

# macOS [TBD]

# Windows
      # Generate EXE
      - name: Build executable
        if: matrix.target == 'Windows'
        shell: powershell
        run: |
          cd windows
          python -m PyInstaller tlum.spec
          New-Item -ItemType Directory -Force -Path dist/assets
          Copy-Item -Path "..\assets\*" -Destination ".\dist\assets\" -Recurse
          Copy-Item -Path "AppxManifest.xml" -Destination "dist"

      - name: Update Version
        if: matrix.target == 'Windows'
        shell: powershell
        run: |
          $manifestPath = "windows\dist\AppxManifest.xml"
          (Get-Content $manifestPath -Raw) -replace '(<Identity[^>]*\sVersion=")[^"]+(")', "`${1}${{ needs.release.outputs.version }}.0`${2}" | Set-Content $manifestPath -Encoding utf8

        # Generate ZIP for Artifacts
      - name: Compress Windows Package
        if: matrix.target == 'Windows'
        run: compress-archive -Path * -DestinationPath ${env:GITHUB_WORKSPACE}/tlum_${{ matrix.target }}${{ matrix.asset_extension }}
        working-directory: ${{ matrix.build_path }}

      # Generate MSIX
      - name: Install Chocolatey
        if: matrix.target == 'Windows'
        shell: powershell
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))

      - name: Verify Chocolatey
        if: matrix.target == 'Windows'
        shell: powershell
        run: choco -v

      - name: Install Windows 10 SDK
        if: matrix.target == 'Windows'
        shell: powershell
        run: choco install windows-sdk-10.0 -y --ignore-checksums

      - name: Locate Make Appx
        if: matrix.target == 'Windows'
        id: find_makeappx
        shell: powershell
        run: |
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter makeappx.exe |
                      Where-Object { $_.FullName -match '\\x64\\' } |
                      Select-Object -First 1 -ExpandProperty FullName
          if (-not $makeappx) { throw "makeappx.exe (x64) not found!" }
          echo "Found makeappx.exe at $makeappx"
          echo "MAKEAPPX=$makeappx" >> $env:GITHUB_ENV

      - name: Package Application
        if: matrix.target == 'Windows'
        shell: powershell
        run: |
          & "${{ env.MAKEAPPX }}" pack /d "${{ matrix.build_path }}" /p "${{ matrix.build_path }}/tlum.msix"

      # Publish to Microsoft Store
      - name: Setup MS Store CLI
        if: matrix.target == 'Windows'
        uses: microsoft/setup-msstore-cli@ec39acd1144351ab7a9d8d25e12bf6fd1ba03150

      - name: Publish MSIX to the Microsoft Store
        if: matrix.target == 'Windows'
        run: |
          msstore reconfigure --tenantId ${{ secrets.WINDOWS_TENANT_ID }} --clientId ${{ secrets.WINDOWS_CLIENT_ID }} --clientSecret ${{ secrets.WINDOWS_SECRET }} --sellerId ${{ secrets.WINDOWS_SELLER_ID }}
          msstore publish "${{ github.workspace }}/${{ matrix.build_path }}/tlum.msix" -v -id 9NMKX9HVSVBP
        working-directory: ${{ matrix.build_path }}

# Linux
      - name: Install system dependencies for Kivy
        if: ${{ matrix.target == 'Linux' || matrix.target == 'LinuxAppImage' }}
        run: |
          sudo apt-get update
          sudo apt-get install libsdl2-2.0-0 libsdl2-dev libsdl2-mixer-2.0-0 libsdl2-mixer-dev
          sudo apt-get install ffmpeg libavdevice-dev libavformat-dev libavfilter-dev libswscale-dev

      - name: Build executable
        if: ${{ matrix.target == 'Linux' || matrix.target == 'LinuxAppImage' }}
        run: |
          cd linux
          export KIVY_WINDOW=sdl2
          export SDL_VIDEODRIVER=dummy
          export KIVY_GL_BACKEND=angle_sdl2
          export KIVY_LOG_LEVEL=warning
          python -m PyInstaller tlum.spec
          mkdir -p ./dist/tlum/assets
          cp -r ./../assets/* ./dist/tlum/assets/
          cp ./../com.tercad.tlum.svg ./dist/tlum/
          cp ./../com.tercad.tlum.desktop ./dist/tlum/

      - name: Compress Linux Package
        if: matrix.target == 'Linux'
        run: tar -czf "$GITHUB_WORKSPACE/tlum_Linux.tar.gz" .
        working-directory: ${{ matrix.build_path }}

# Linux: AppImage
      - name: Patch Manifest
        if: matrix.target == 'LinuxAppImage'
        run: |
          cp -r ./../linux/dist/tlum/* ./AppDir
          sh patch.sh -v "${{ needs.release.outputs.version }}"
        working-directory: ${{ matrix.build_path }}

      - name: Build Linux AppImage
        if: matrix.target == 'LinuxAppImage'
        run: |
          sudo apt-get install -y libfuse2
          wget -O appimage-builder-x86_64.AppImage https://github.com/AppImageCrafters/appimage-builder/releases/download/v1.1.0/appimage-builder-1.1.0-x86_64.AppImage
          chmod +x appimage-builder-x86_64.AppImage
          ./appimage-builder-x86_64.AppImage --recipe AppImageBuilder.yml
          cp Tlum-${{ needs.release.outputs.version }}-x86_64.AppImage "$GITHUB_WORKSPACE/tlum_${{ matrix.target }}.AppImage"
        working-directory: ${{ matrix.build_path }}

# Linux: Snap
      - name: Install Snapcraft
        if: matrix.target == 'LinuxSnap'
        uses: canonical/setup-lxd@v1

      - name: Update Version
        if: matrix.target == 'LinuxSnap'
        run: |
          VERSION="${{ needs.release.outputs.version }}+${{ needs.release.outputs.build_number }}"
          echo "Updating snap version to $VERSION"
          sed -i "s/^version:.*$/version: $VERSION/" snapcraft.yaml
          cat snapcraft.yaml | grep version

      - name: Build Snap
        if: matrix.target == 'LinuxSnap'
        run: |
          sudo snap install snapcraft --classic
          for attempt in 1 2 3; do
            snapcraft pack --verbose && break
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Snapcraft build failed; retrying ($attempt/3)."
          done
          cp tlum_${{ needs.release.outputs.version }}+${{ needs.release.outputs.build_number }}_amd64.snap "$GITHUB_WORKSPACE/tlum_${{ matrix.target }}.snap"

## TODO: Resolve failure on start: "Emergency stop (memory image dumped to disk)"
#      - name: Publish Snap
#        if: matrix.target == 'LinuxSnap'
#        env:
#          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_CREDENTIALS }}
#        run: |
#          sudo --preserve-env=SNAPCRAFT_STORE_CREDENTIALS snapcraft upload tlum_${{ matrix.target }}.snap --release=latest/stable

# Android
      - name: Install dependencies
        if: startsWith(matrix.target, 'Android')
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool m4 \
              libffi-dev pkg-config libltdl-dev openjdk-17-jdk unzip \
              build-essential gcc g++
          # Error: App must support 16 KB memory page sizes (#44)
          pip install --upgrade git+https://github.com/kivy/python-for-android.git@develop
          pip install --upgrade git+https://github.com/kivy/buildozer.git@master

      - name: Apply Android Keychain
        if: startsWith(matrix.target, 'Android')
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PSSW: ${{ secrets.ANDROID_KEYSTORE_PSSW }}
        run: |
          echo -n "$ANDROID_KEYSTORE" | base64 -d > key.keystore
          echo "P4A_RELEASE_KEYSTORE=$(pwd)/key.keystore" >> $GITHUB_ENV
          echo "P4A_RELEASE_KEYSTORE_PASSWD=$ANDROID_KEYSTORE_PSSW" >> $GITHUB_ENV
          echo "P4A_RELEASE_KEYALIAS_PASSWD=$ANDROID_KEYSTORE_PSSW" >> $GITHUB_ENV
          echo "P4A_RELEASE_KEYALIAS=key" >> $GITHUB_ENV

      - name: Update version and build number
        if: startsWith(matrix.target, 'Android')
        run: |
          sed -i "s/^version = .*/version = ${{ needs.release.outputs.version }}/" buildozer.spec
          sed -i "s/^android.numeric_version = .*/android.numeric_version = ${{ needs.release.outputs.build_number }}/" buildozer.spec

          echo "Updated buildozer.spec:"
          grep "^version = " buildozer.spec
          grep "^android.numeric_version" buildozer.spec

      - name: Compile Android package
        if: startsWith(matrix.target, 'Android')
        env:
          # Clean environment for p4a
          PYTHONHOME: ""
          PYTHONPATH: ""
          # 16KB page size support for Android 15+ (required by Google Play)
          LDFLAGS: "-Wl,-z,max-page-size=16384"
        run: |
          buildozer android release

      - name: Compile Android Debug package
        if: matrix.target == 'AndroidDebug'
        run: |
          buildozer android debug

      - name: Search for a package and copy to workspace
        if: startsWith(matrix.target, 'Android')
        run: |
          APK_PATH=$(find build -name "*${{ matrix.asset_extension }}" -type f | head -1)
          cp "$APK_PATH" "$GITHUB_WORKSPACE/tlum_${{ matrix.target }}${{ matrix.asset_extension }}"

#
      - name: Upload ${{ matrix.target }} Artifact
        id: upload_release_asset
        uses: actions/upload-release-asset@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: ./tlum_${{ matrix.target }}${{ matrix.asset_extension }}
          asset_name: tlum_${{ matrix.target }}${{ matrix.asset_extension }}
          asset_content_type: ${{ matrix.asset_content_type }}

# Linux: Flatpak
  build-flatpak:
    uses: ./.github/workflows/build_package_flatpak.yml
    permissions:
      contents: write
    if: success()
    needs:
      - release
      - build
    secrets: inherit
    with:
      version: ${{ needs.release.outputs.version }}
      sha: ${{ github.sha }}
      upload_url: ${{ needs.release.outputs.upload_url }}
      is_release: true
