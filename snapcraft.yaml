name: tlum
summary: (WIP) Open source code cross-platform language learning application
version: 0.0.1+1
description: |
  Open source code cross-platform language learning application leverages
  the power of natural language processing to pinpoint pronunciation gaps
  and machine learning to boost vocabulary proficiency.
base: core22
confinement: strict

parts:
  portaudio:
    # libportaudio2 19.6.0 of Ubuntu 22.04 aborts on start: BuildDeviceList: Assertion `devIdx < numDeviceNames' failed.
    plugin: autotools
    source: https://github.com/PortAudio/portaudio.git
    source-tag: v19.7.0
    autotools-configure-parameters:
      - --prefix=/usr
      - --without-jack
      - --without-oss
    build-packages:
      - libasound2-dev
    prime:
      - -usr/include
      - -usr/lib/pkgconfig
      - -usr/lib/*.a
      - -usr/lib/*.la

  tlum:
    plugin: python
    source: .
    build-environment:
      - PIP_IGNORE_INSTALLED: "1"
    stage-packages:
      - ffmpeg
      - libpulse0
      - libpulse-mainloop-glib0
      - libasound2
      - libasound2-plugins
      - libsdl2-2.0-0
      - libsdl2-mixer-2.0-0
      - libsndfile1
      - xclip
      - xsel
    prime:
      - -usr/lib/*/libGL*
      - -usr/lib/*/libEGL*
      - -usr/lib/*/libgbm*
      - -usr/lib/*/libglapi*
      - -usr/lib/*/libdrm*
      - -usr/lib/*/dri
    override-build: |
      python3 -m pip install --ignore-installed --upgrade pip
      python3 -m pip install --ignore-installed --prefix=$SNAPCRAFT_PART_INSTALL -r requirements.txt
      snapcraftctl build
      cp -r src $SNAPCRAFT_PART_INSTALL/
      cp -r assets $SNAPCRAFT_PART_INSTALL/
    # update-alternatives is not run for staged packages: ffmpeg fails with "libblas.so.3: cannot open shared object file".
    override-prime: |
      craftctl default
      ln -sf blas/libblas.so.3 usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libblas.so.3
      ln -sf lapack/liblapack.so.3 usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/liblapack.so.3

apps:
  tlum:
    command: bin/python3 $SNAP/src/main.py
    environment:
      KIVY_AUDIO: ffpyplayer
      SDL_AUDIODRIVER: pulse
      KIVY_WINDOW: sdl2
      KIVY_GL_BACKEND: gl
      TLUM_DATA_DIR: $SNAP_USER_COMMON
    plugs:
      - home
      - desktop
      - network
      - opengl
      - x11
      - audio-playback
      - audio-record
      - pulseaudio
    extensions:
      - gnome
